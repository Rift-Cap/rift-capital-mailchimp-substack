name: Mirror Mailchimp to Substack drafts

on:
  schedule:
    # Weekly: Friday 17:00 Europe/Paris (CEST, UTC+2) = 15:00 UTC.
    # GitHub Actions cron always runs in UTC, so once Europe switches back
    # to CET (UTC+1) in late October this will fire at 16:00 Paris time
    # instead of 17:00 -- adjust the hour here if that matters.
    - cron: "0 15 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs (e.g. the weekly schedule and a manual re-run) execute
# at once -- overlapping runs would both fetch the same not-yet-processed
# campaign, both write a draft, and race on the final `git push`, which is
# exactly how a duplicate draft/state entry (or a rejected push) happens.
# Queue the second run instead of cancelling it, so nothing is dropped.
concurrency:
  group: mirror-mailchimp-to-substack
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch new campaigns
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_AUDIENCE_ID: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
        run: python scripts/fetch_campaigns.py

      - name: Transform content
        run: python scripts/transform_content.py

      - name: Commit updated state and drafts
        run: |
          git config user.name "mirror-bot"
          git config user.email "actions@github.com"
          git add state/processed_campaigns.json drafts/
          git diff --cached --quiet || git commit -m "Mirror: new campaign(s) prepared"
          git pull --rebase --autostash
          git push
